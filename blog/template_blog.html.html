<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Resumo com dado numérico (≤155 chars). Ex: 'Estudo ABSOLAR mostra que soiling reduz em até 25% a geração de painéis solares no Brasil.'">
  <meta name="robots" content="index, follow">
  <title>{Título} | SNDLimp</title>
  <link rel="canonical" href="https://edusidegum.github.io/sndlimp/blog/posts/{slug}.html">
  <link rel="stylesheet" href="../../assets/css/style.css">

  <!-- ═══ JSON-LD: TechArticle + Service + LocalBusiness ═══ -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "TechArticle",
        "@id": "https://edusidegum.github.io/sndlimp/blog/posts/{slug}.html#article",
        "headline": "{Título do Artigo}",
        "description": "{Resumo com dado fonteado}",
        "datePublished": "{2026-07-22}",
        "dateModified": "{2026-07-22}",
        "author": {
          "@type": "Person",
          "name": "Eduardo Sidegum",
          "url": "https://edusidegum.github.io/edusidegum/"
        },
        "publisher": { "@id": "https://edusidegum.github.io/sndlimp/#business" },
        "about": { "@id": "https://edusidegum.github.io/sndlimp/#business" },
        "mainEntityOfPage": "https://edusidegum.github.io/sndlimp/blog/posts/{slug}.html",
        "proficiencyLevel": "Beginner",
        "timeRequired": "PT5M",
        "citation": [
          { "@type": "ScholarlyArticle", "name": "{Fonte 1}" },
          { "@type": "ScholarlyArticle", "name": "{Fonte 2}" }
        ]
      }
    ]
  }
  </script>
</head>
<body>
  <!-- TOPBAR estática (mesma das páginas cidade) -->

  <main>
    <article itemscope itemtype="https://schema.org/TechArticle" 
             style="max-width:720px;margin:100px auto 40px;padding:0 20px;">

      <!-- Cabeçalho do post -->
      <header style="margin-bottom:40px;">
        <p style="color:var(--sol);font-size:0.8rem;text-transform:uppercase;letter-spacing:2px;">
          📄 Blog Técnico — {Data}
        </p>
        <h1 itemprop="headline" style="font-size:clamp(22px,3vw,36px);font-weight:900;line-height:1.2;">
          {Título com dado quantitativo}
        </h1>
        <p itemprop="description" style="color:var(--texto2);font-size:1.05rem;line-height:1.5;">
          {Resumo direto: até 2 linhas, com número e fonte}
        </p>
        <address itemprop="author" itemscope itemtype="https://schema.org/Person"
                 style="font-style:normal;color:var(--texto2);font-size:0.85rem;margin-top:12px;">
          Por <span itemprop="name">Eduardo Sidegum</span> — 
          <time itemprop="datePublished" datetime="{2026-07-22}">{22 jul 2026}</time>
        </address>
      </header>

      <!-- Corpo: seções com perguntas como H2 -->
      <section>
        <h2>{Pergunta direta do usuário?}</h2>
        <p>{Resposta objetiva com dado fonteado — ≤150 caracteres ideal}</p>
        <p style="font-size:0.82rem;color:var(--texto2);">
          Fonte: <a href="{link}" target="_blank" rel="noopener">{Nome da Fonte}</a>
        </p>
      </section>

      <section>
        <h2>{Próxima pergunta?}</h2>
        <p>{...}</p>
      </section>

    </article>
  </main>

  <!-- FOOTER (mesma das páginas cidade) -->
  <script>/* scripts existentes */</script>
</body>
</html>

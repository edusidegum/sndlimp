<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="author" content="e-Sid Tech">
<meta name="generator" content="e-Sid Tech — Engenharia de Soluções Digitais">
<link rel="author" href="https://edusidegum.github.io/edusidegum/sobre.html">

<title>Cidades atendidas — SNDLimp</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    background:
      linear-gradient(135deg, rgba(0,20,40,0.88) 0%, rgba(0,40,70,0.82) 50%, rgba(0,60,50,0.85) 100%),
      url('https://raw.githubusercontent.com/edusidegum/menu/refs/heads/main/compartilhado/img/em_obras.jpg') center/cover no-repeat fixed;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    overflow-x: hidden;
  }

  /* ── animated particles ── */
  .particles {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
  }
  .particle {
    position: absolute;
    background: rgba(255,255,255,0.08);
    border-radius: 50%;
    animation: floatUp linear infinite;
  }
  @keyframes floatUp {
    0%   { transform: translateY(100vh) scale(0); opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 1; }
    100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
  }

  /* ── main container ── */
  .container {
    position: relative; z-index: 1;
    width: 100%; max-width: 1100px;
    text-align: center;
  }

  /* ── header ── */
  .header {
    margin-bottom: 2.5rem;
  }
  .header .icon {
    font-size: 3rem;
    margin-bottom: 0.5rem;
    display: block;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { transform: scale(1); opacity: 0.9; }
    50%     { transform: scale(1.12); opacity: 1; }
  }
  .header h1 {
    font-size: clamp(1.8rem, 4vw, 2.8rem);
    font-weight: 800;
    color: #fff;
    text-shadow: 0 2px 12px rgba(0,180,216,0.5);
    letter-spacing: -0.02em;
  }
  .header h1 span {
    background: linear-gradient(135deg, #00d4ff, #7bff8e);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .header .subtitle {
    color: rgba(255,255,255,0.65);
    font-size: 1rem;
    font-weight: 400;
    margin-top: 0.4rem;
  }

  /* ── search ── */
  .search-wrap {
    margin-bottom: 2rem;
    display: flex;
    justify-content: center;
  }
  .search-wrap input {
    width: 100%; max-width: 420px;
    padding: 0.85rem 1.4rem;
    border-radius: 50px;
    border: 2px solid rgba(255,255,255,0.18);
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
    color: #fff;
    font-size: 1rem;
    font-family: inherit;
    outline: none;
    transition: all 0.3s;
  }
  .search-wrap input::placeholder { color: rgba(255,255,255,0.4); }
  .search-wrap input:focus {
    border-color: rgba(0,212,255,0.6);
    background: rgba(255,255,255,0.13);
    box-shadow: 0 0 24px rgba(0,180,216,0.25);
  }

  /* ── stats bar ── */
  .stats {
    display: flex; gap: 1.5rem; justify-content: center; flex-wrap: wrap;
    margin-bottom: 2rem;
  }
  .stat-badge {
    background: rgba(255,255,255,0.07);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 50px;
    padding: 0.45rem 1.2rem;
    color: rgba(255,255,255,0.75);
    font-size: 0.85rem;
    font-weight: 500;
  }
  .stat-badge strong { color: #00d4ff; }

  /* ── word cloud ── */
  .cloud {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 0.6rem 1.2rem;
    padding: 2.5rem 1.5rem;
    min-height: 320px;
    background: rgba(255,255,255,0.03);
    border-radius: 28px;
    border: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(6px);
    transition: all 0.4s;
  }
  .cloud.loading {
    justify-content: center;
    align-items: center;
  }

  /* ── each word ── */
  .cloud a {
    display: inline-block;
    text-decoration: none;
    font-weight: 700;
    line-height: 1.25;
    padding: 0.15em 0.35em;
    border-radius: 8px;
    transition: all 0.25s cubic-bezier(.4,0,.2,1);
    position: relative;
    white-space: nowrap;
  }
  .cloud a:hover {
    transform: translateY(-3px) scale(1.08);
    text-shadow: 0 0 18px currentColor;
    background: rgba(255,255,255,0.08);
  }
  .cloud a:active {
    transform: scale(0.96);
  }

  /* ── sizes ── */
  .sz-xl { font-size: 2.6rem; }
  .sz-lg { font-size: 2.0rem; }
  .sz-md { font-size: 1.55rem; }
  .sz-sm { font-size: 1.2rem; }
  .sz-xs { font-size: 0.95rem; }

  /* ── colors ── */
  .c1  { color: #00d4ff; }
  .c2  { color: #7bff8e; }
  .c3  { color: #ffb347; }
  .c4  { color: #ff6b9d; }
  .c5  { color: #a78bfa; }
  .c6  { color: #f9f871; }
  .c7  { color: #67e8f9; }
  .c8  { color: #fb7185; }
  .c9  { color: #86efac; }
  .c10 { color: #fde68a; }

  /* ── spinner ── */
  .spinner {
    width: 48px; height: 48px;
    border: 4px solid rgba(255,255,255,0.12);
    border-top-color: #00d4ff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── error ── */
  .error-msg {
    color: #fb7185;
    font-size: 1rem;
    text-align: center;
    padding: 2rem;
  }

  /* ── footer ── */
  .footer {
    margin-top: 2.5rem;
    z-index: 1;
  }
  .footer a {
    display: inline-flex; align-items: center; gap: 0.5rem;
    background: rgba(37,211,102,0.15);
    border: 1px solid rgba(37,211,102,0.35);
    color: #7bff8e;
    padding: 0.7rem 1.8rem;
    border-radius: 50px;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.95rem;
    transition: all 0.3s;
    backdrop-filter: blur(6px);
  }
  .footer a:hover {
    background: rgba(37,211,102,0.28);
    box-shadow: 0 0 28px rgba(37,211,102,0.25);
    transform: translateY(-2px);
  }

  /* ── responsive ── */
  @media (max-width: 600px) {
    body { padding: 1.2rem; }
    .cloud { gap: 0.4rem 0.8rem; padding: 1.5rem 0.8rem; }
    .sz-xl { font-size: 1.8rem; }
    .sz-lg { font-size: 1.45rem; }
    .sz-md { font-size: 1.15rem; }
    .sz-sm { font-size: 0.95rem; }
    .sz-xs { font-size: 0.8rem; }
  }
</style>
</head>
<body>

<!-- floating particles -->
<div class="particles" id="particles"></div>

<div class="container">

  <div class="header">
    <span class="icon">☀️</span>
    <h1>Atendimento nas <span>Cidades</span></h1>
    <p class="subtitle">Encontre sua cidade e solicite a limpeza dos seus painéis solares</p>
  </div>

  <div class="search-wrap">
    <input type="text" id="search" placeholder="🔍  Digite o nome da cidade..." autocomplete="off">
  </div>

  <div class="stats" id="stats">
    <span class="stat-badge">🏙️ <strong id="count">—</strong> cidades</span>
    <span class="stat-badge">📍 <strong id="regions">—</strong> regiões</span>
  </div>

  <div class="cloud loading" id="cloud">
    <div class="spinner"></div>
  </div>

</div>

<div class="footer">
  <a href="https://wa.me/5551996033200?text=Ol%C3%A1!%20Quero%20saber%20mais%20sobre%20limpeza%20de%20placas%20solares." target="_blank" rel="noopener">
    💬 Fale Conosco no WhatsApp
  </a>
</div>

<script>
(async function () {
  const CIDADES_DIR = 'https://api.github.com/repos/edusidegum/sndlimp/contents/cidades';
  const CIDADES_JSON = 'https://raw.githubusercontent.com/edusidegum/sndlimp/main/cidades/cidades.json';
  const BASE_URL = 'https://edusidegum.github.io/sndlimp/cidades/';

  const cloudEl = document.getElementById('cloud');
  const searchEl = document.getElementById('search');
  const countEl = document.getElementById('count');
  const regionsEl = document.getElementById('regions');

  // ── particle background ──
  (function spawnParticles() {
    const wrap = document.getElementById('particles');
    for (let i = 0; i < 40; i++) {
      const p = document.createElement('div');
      p.classList.add('particle');
      const size = Math.random() * 6 + 2;
      p.style.width  = size + 'px';
      p.style.height = size + 'px';
      p.style.left   = Math.random() * 100 + '%';
      p.style.animationDuration = (Math.random() * 14 + 8) + 's';
      p.style.animationDelay    = (Math.random() * 10) + 's';
      wrap.appendChild(p);
    }
  })();

  // ── fetch directory listing ──
  let cities = [];

  try {
    const res = await fetch(CIDADES_DIR);
    if (!res.ok) throw new Error('Erro ao acessar o diretório (HTTP ' + res.status + ')');
    const files = await res.json();

    // Filter: only .html files, exclude index.html and *cidade.html
    const htmlFiles = files.filter(f =>
      f.type === 'file' &&
      f.name.endsWith('.html') &&
      f.name !== 'index.html' &&
      !f.name.match(/cidade\.html$/i)
    );

    // Extract slugs from filenames
    const slugs = htmlFiles.map(f => f.name.replace(/\.html$/, ''));

    // ── fetch cidades.json for proper display names ──
    let nameMap = {};
    try {
      const jsonRes = await fetch(CIDADES_JSON);
      if (jsonRes.ok) {
        const jsonData = await jsonRes.json();
        jsonData.forEach(c => { nameMap[c.slug] = c; });
      }
    } catch (_) { /* fallback: use slug as name */ }

    // Build cities array
    cities = slugs.map(slug => {
      const info = nameMap[slug];
      return {
        slug: slug,
        nome: info ? info.nome : slug.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase()),
        regiao: info ? info.regiao : null,
        url: BASE_URL + slug + '.html'
      };
    });

    // Sort alphabetically
    cities.sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));

  } catch (err) {
    cloudEl.classList.remove('loading');
    cloudEl.innerHTML = '<div class="error-msg">⚠️ Não foi possível carregar a lista de cidades.<br><small>' + err.message + '</small></div>';
    return;
  }

  // ── stats ──
  countEl.textContent = cities.length;
  const uniqueRegions = new Set(cities.map(c => c.regiao).filter(Boolean));
  regionsEl.textContent = uniqueRegions.size || '—';

  // ── size & color assignment ──
  const sizes = ['sz-xl', 'sz-lg', 'sz-md', 'sz-sm', 'sz-xs'];
  const colors = ['c1','c2','c3','c4','c5','c6','c7','c8','c9','c10'];

  // Deterministic pseudo-random based on city index (so it stays consistent)
  function pick(arr, seed) {
    return arr[seed % arr.length];
  }

  // ── render ──
  function render(filterText = '') {
    const term = filterText.trim().toLowerCase();
    const filtered = term
      ? cities.filter(c => c.nome.toLowerCase().includes(term) || c.slug.toLowerCase().includes(term))
      : cities;

    if (filtered.length === 0) {
      cloudEl.innerHTML = '<p style="color:rgba(255,255,255,0.5);font-size:1.1rem;padding:2rem;">Nenhuma cidade encontrada para "<strong>' + filterText + '</strong>"</p>';
      return;
    }

    // Shuffle for cloud effect (deterministic by slug)
    const shuffled = [...filtered].sort((a, b) => a.slug.localeCompare(b.slug));

    cloudEl.innerHTML = shuffled.map((c, i) => {
      const sizeClass = pick(sizes, i);
      const colorClass = pick(colors, i * 3 + 1);
      return '<a href="' + c.url + '" class="' + sizeClass + ' ' + colorClass + '" title="' + c.nome + (c.regiao ? ' — ' + c.regiao : '') + '">' + c.nome + '</a>';
    }).join('');
  }

  cloudEl.classList.remove('loading');
  render();

  // ── search (debounced) ──
  let debounceTimer;
  searchEl.addEventListener('input', function () {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => render(this.value), 250);
  });

})();
</script>
</body>
</html>
